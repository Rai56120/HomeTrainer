services:
  backend:
    build:
      context: ./backend
    environment:
      HOME_TRAINER_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:8080"
